name: Capture Real Royal Storefront
on:
  push:
    branches:
      - portfolio-v4/signature-refinement
    paths:
      - .github/workflows/royal-media.yml
      - scripts/capture-royal.mjs
permissions:
  contents: write
jobs:
  capture-royal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright sharp
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-royal.mjs
      - name: Add original Royal project preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+majda03@users.noreply.github.com"
          git add images/royal-storefront.webp
          git diff --cached --quiet || (git commit -m "Add real Royal Cosmetics storefront preview" && git push origin HEAD:portfolio-v4/signature-refinement)
