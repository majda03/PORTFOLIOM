name: Atelier portfolio checks
on:
  push:
    branches: [redesign/kinetic-atelier]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check atelier.js
      - run: node scripts/check-atelier.mjs
      - run: node scripts/build-static.mjs
